    <noscript>
      <h1>GH Insight</h1>
      <p>A browser-based dashboard for analysing GitHub milestone progress. Connect any public or private repository and explore issues and pull requests across seven interactive views, then export the data in the format you need.</p>

      <h2>What views are available?</h2>
      <ul>
        <li><strong>Gantt</strong> — interactive horizontal bar timeline for every issue and PR, with scroll-wheel zoom and resizable labels</li>
        <li><strong>Burndown</strong> — daily open issue count plotted over the milestone lifetime</li>
        <li><strong>Cycle Time</strong> — scatter plot of days from creation to close per item, with median and mean reference lines</li>
        <li><strong>Velocity</strong> — weekly stacked bar chart of closed issues and merged or closed pull requests</li>
        <li><strong>Cumulative Flow</strong> — running totals of created vs completed items over time</li>
        <li><strong>Contributors</strong> — per-author breakdown of issues and pull requests</li>
        <li><strong>List</strong> — sortable table of all items with status, dates, labels, assignees, and duration</li>
      </ul>

      <h2>How do I export GitHub milestone data?</h2>
      <p>Every view supports export. Choose from CSV, Excel (XLSX), Markdown, or PDF for data exports. For visual exports, capture a PNG of the current view or a full-resolution PNG of the entire Gantt timeline.</p>

      <h2>Does it work with private repositories?</h2>
      <p>Yes. Connect with a fine-grained GitHub Personal Access Token with read-only access to Issues, Pull Requests, Contents, and Metadata. Your token is encrypted locally with AES-GCM (256-bit) using the Web Crypto API and never leaves your browser.</p>

      <h2>Can I view multiple milestones at once?</h2>
      <p>Yes. Load several milestones from the same repository simultaneously. Items are colour-coded by milestone across all views, making it easy to compare progress across sprints or releases.</p>

      <h2>Is there a desktop app?</h2>
      <p>Yes. Download the Electron desktop app for Windows, macOS, or Linux from the GitHub Releases page.</p>

      <p><em>JavaScript is required to use this application.</em></p>
