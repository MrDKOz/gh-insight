<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0d1117"/>

  <!-- Subtle grid lines -->
  <line x1="620" y1="80" x2="620" y2="480" stroke="#21262d" stroke-width="1"/>
  <line x1="720" y1="80" x2="720" y2="480" stroke="#21262d" stroke-width="1"/>
  <line x1="820" y1="80" x2="820" y2="480" stroke="#21262d" stroke-width="1"/>
  <line x1="920" y1="80" x2="920" y2="480" stroke="#21262d" stroke-width="1"/>
  <line x1="1020" y1="80" x2="1020" y2="480" stroke="#21262d" stroke-width="1"/>
  <line x1="1120" y1="80" x2="1120" y2="480" stroke="#21262d" stroke-width="1"/>

  <!-- Gantt bar rows -->
  <!-- Row 1 -->
  <rect x="620" y="110" width="340" height="30" rx="5" fill="#0969da"/>
  <!-- Row 2 -->
  <rect x="680" y="160" width="260" height="30" rx="5" fill="#2da44e"/>
  <!-- Row 3 -->
  <rect x="640" y="210" width="400" height="30" rx="5" fill="#0969da" opacity="0.55"/>
  <!-- Row 4 -->
  <rect x="700" y="260" width="220" height="30" rx="5" fill="#2da44e" opacity="0.75"/>
  <!-- Row 5 -->
  <rect x="650" y="310" width="300" height="30" rx="5" fill="#0969da" opacity="0.4"/>
  <!-- Row 6 -->
  <rect x="720" y="360" width="180" height="30" rx="5" fill="#2da44e" opacity="0.5"/>
  <!-- Row 7 -->
  <rect x="660" y="410" width="260" height="30" rx="5" fill="#0969da" opacity="0.3"/>

  <!-- Today marker -->
  <line x1="900" y1="90" x2="900" y2="460" stroke="#e3b341" stroke-width="2" stroke-dasharray="6,4" opacity="0.85"/>
  <rect x="882" y="76" width="36" height="18" rx="4" fill="#e3b341"/>
  <text x="900" y="89" font-family="system-ui,-apple-system,sans-serif" font-size="11" font-weight="600" fill="#0d1117" text-anchor="middle">today</text>

  <!-- Left accent bar -->
  <rect x="0" y="0" width="5" height="630" fill="#0969da"/>

  <!-- Icon -->
  <rect x="80" y="120" width="52" height="52" rx="10" fill="#0969da"/>
  <rect x="92"  y="132" width="22" height="7"  rx="2" fill="#fff"/>
  <rect x="92"  y="143" width="30" height="7"  rx="2" fill="#fff" opacity="0.8"/>
  <rect x="92"  y="154" width="16" height="7"  rx="2" fill="#fff" opacity="0.6"/>

  <!-- Title -->
  <text x="80" y="240" font-family="system-ui,-apple-system,sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1">GitHub Work</text>
  <text x="80" y="326" font-family="system-ui,-apple-system,sans-serif" font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-1">Visualiser</text>

  <!-- Tagline -->
  <text x="80" y="390" font-family="system-ui,-apple-system,sans-serif" font-size="26" fill="#8b949e">Gantt charts · Burndown · Cycle time · Velocity</text>

  <!-- Divider -->
  <line x1="80" y1="430" x2="530" y2="430" stroke="#21262d" stroke-width="1.5"/>

  <!-- URL -->
  <text x="80" y="465" font-family="system-ui,-apple-system,sans-serif" font-size="22" fill="#0969da">dkoz.me/gh-insight</text>
</svg>
