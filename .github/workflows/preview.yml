name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  deployments: write

# Cancel in-progress preview builds for the same PR when new commits arrive.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create GitHub deployment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        id: deployment
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `pr-${{ github.event.number }}`,
              auto_merge: false,
              required_contexts: [],
              description: `Preview for PR #${{ github.event.number }}`,
              transient_environment: true,
            });
            return data.id;

      - name: Build preview
        env:
          DEPLOY_BASE: /gh-insight/pr-${{ github.event.number }}/
        run: npm run build

      - name: Checkout gh-pages branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: gh-pages
          path: _site
          fetch-depth: 1

      - name: Deploy preview
        run: |
          git -C _site config user.name "github-actions[bot]"
          git -C _site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p "_site/pr-${{ github.event.number }}"
          rsync -a --delete dist/ "_site/pr-${{ github.event.number }}/"
          cd _site
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: deploy preview for PR ${{ github.event.number }}"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin gh-pages
              if git push; then break; fi
              if [ "$attempt" -eq 5 ]; then echo "Failed to push after 5 attempts" && exit 1; fi
              echo "Push raced with another gh-pages writer; retrying ($attempt/5)..."
              sleep $((attempt * 2))
            done
          fi

      - name: Mark deployment success
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const url = `https://dkoz.me/gh-insight/pr-${{ github.event.number }}/`;
            const maxAttempts = 24;  // 24 × 10s = 4 minutes max
            let ready = false;
            for (let i = 0; i < maxAttempts; i++) {
              try {
                const res = await fetch(url);
                if (res.ok) { ready = true; break; }
              } catch (_) { /* network blip — keep polling */ }
              await new Promise(r => setTimeout(r, 10_000));
            }
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: ready ? 'success' : 'failure',
              environment_url: url,
              description: ready ? 'Preview ready' : 'Preview did not become reachable in time',
            });


  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: gh-pages

      - name: Mark deployments inactive and delete
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: `pr-${{ github.event.number }}`,
            });
            for (const d of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: d.id,
                state: 'inactive',
              });
              await github.rest.repos.deleteDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: d.id,
              });
            }

      - name: Delete environment
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ secrets.ENVIRONMENTS_TOKEN }}
          script: |
            try {
              await github.rest.repos.deleteAnEnvironment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                environment_name: `pr-${{ github.event.number }}`,
              });
            } catch (e) {
              if (e.status !== 404) throw e;
            }

      - name: Remove preview directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf pr-${{ github.event.number }} 2>/dev/null || true
          if ! git diff --staged --quiet; then
            git commit -m "chore: remove preview for PR ${{ github.event.number }}"
            for attempt in 1 2 3; do
              git pull --rebase origin gh-pages
              if git push; then break; fi
              if [ "$attempt" -eq 3 ]; then echo "Failed to push after 3 attempts" && exit 1; fi
              echo "Push raced with another gh-pages writer; retrying ($attempt/3)..."
              sleep $((attempt * 2))
            done
          fi
