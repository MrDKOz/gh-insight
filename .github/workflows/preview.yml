name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  deployments: write

# Cancel in-progress preview builds for the same PR when new commits arrive.
concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create GitHub deployment
        uses: actions/github-script@v7
        id: deployment
        with:
          script: |
            const { data } = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.payload.pull_request.head.sha,
              environment: `pr-${{ github.event.number }}`,
              auto_merge: false,
              required_contexts: [],
              description: `Preview for PR #${{ github.event.number }}`,
              transient_environment: true,
            });
            return data.id;

      - name: Build preview
        env:
          DEPLOY_BASE: /gh-insight/pr-${{ github.event.number }}/
        run: npm run build

      - name: Deploy preview
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pr-${{ github.event.number }}
          keep_files: true

      - name: Mark deployment success
        uses: actions/github-script@v7
        with:
          script: |
            const url = `https://dkoz.me/gh-insight/pr-${{ github.event.number }}/`;
            const maxAttempts = 24;  // 24 × 10s = 4 minutes max
            let ready = false;
            for (let i = 0; i < maxAttempts; i++) {
              try {
                const res = await fetch(url);
                if (res.ok) { ready = true; break; }
              } catch (_) { /* network blip — keep polling */ }
              await new Promise(r => setTimeout(r, 10_000));
            }
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: ${{ steps.deployment.outputs.result }},
              state: ready ? 'success' : 'failure',
              environment_url: url,
              description: ready ? 'Preview ready' : 'Preview did not become reachable in time',
            });


  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Mark deployments inactive and delete
        uses: actions/github-script@v7
        with:
          script: |
            const { data: deployments } = await github.rest.repos.listDeployments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment: `pr-${{ github.event.number }}`,
            });
            for (const d of deployments) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: d.id,
                state: 'inactive',
              });
              await github.rest.repos.deleteDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: d.id,
              });
            }

      - name: Delete environment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ENVIRONMENTS_TOKEN }}
          script: |
            await github.rest.repos.deleteAnEnvironment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              environment_name: `pr-${{ github.event.number }}`,
            });

      - name: Remove preview directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -rf pr-${{ github.event.number }} 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: remove preview for PR ${{ github.event.number }}"
          git push
