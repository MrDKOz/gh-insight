name: Deploy to GitHub Pages

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# Only one deployment runs at a time; don't cancel in-progress runs so a
# partial deploy can't leave the site in a broken state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Checkout gh-pages branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: gh-pages
          path: _site
          fetch-depth: 0

      - name: Deploy to GitHub Pages
        run: |
          git -C _site config user.name "github-actions[bot]"
          git -C _site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Sync main site; exclude .git/ and pr-*/ so repo metadata and active
          # PR previews are preserved.
          rsync -a --delete --exclude='.git/' --exclude='pr-*/' dist/ _site/
          cd _site
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "chore: deploy to GitHub Pages"
            for attempt in 1 2 3; do
              git pull --rebase origin gh-pages
              if git push; then break; fi
              if [ "$attempt" -eq 3 ]; then echo "Failed to push after 3 attempts" && exit 1; fi
              sleep $((attempt * 2))
            done
          fi
