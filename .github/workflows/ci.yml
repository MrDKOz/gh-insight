name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (renderer)
        run: npx tsc --noEmit

      - name: Type-check (electron main)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  e2e:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  cleanup-main-caches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Prune stale main branch caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          echo "Pruning stale caches on main..."
          for PATTERN in "node-cache-Linux" "node-cache-macOS" "node-cache-Windows" "Linux-playwright" "codeql-overlay-base-database"; do
            gh cache list --repo "$REPO" --ref "refs/heads/main" --limit 100 --json id,key,createdAt \
              | jq -r --arg p "$PATTERN" \
                  '[.[] | select(.key | startswith($p))] | sort_by(.createdAt) | reverse | .[1:][].id' \
              | xargs -r -I{} gh cache delete --repo "$REPO" {}
          done
          echo "Done"
