name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    outputs:
      run-tests: ${{ steps.paths.outputs.run-tests }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check for non-CI changes
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Always run on push to main
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On PRs: skip if only .github/ files changed
          CHANGED=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.number }}/files" \
            --paginate --jq '[.[] | .filename] | map(select(test("^\\.github/")|not)) | length')
          if (( CHANGED > 0 )); then
            echo "run-tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "run-tests=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: filter
    if: needs.filter.outputs.run-tests == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check (renderer)
        run: npx tsc --noEmit

      - name: Type-check (electron main)
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Test
        run: npm test

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  e2e:
    needs: [filter, check]
    if: needs.filter.outputs.run-tests == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  cleanup-main-caches:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, e2e]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Prune stale main branch caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          echo "Pruning stale caches on main..."
          for PATTERN in "node-cache-Linux" "node-cache-macOS" "node-cache-Windows" "Linux-playwright" "codeql-overlay-base-database"; do
            gh cache list --repo "$REPO" --ref "refs/heads/main" --limit 100 --json id,key,createdAt \
              | jq -r --arg p "$PATTERN" \
                  '[.[] | select(.key | startswith($p))] | sort_by(.createdAt) | reverse | .[1:][].id' \
              | xargs -r -I{} gh cache delete --repo "$REPO" {}
          done
          echo "Done"
