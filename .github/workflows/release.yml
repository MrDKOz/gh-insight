name: Release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  prepare:
    # Only run when a PR with a release label is merged into main.
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      (
        contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')
      )

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Fetch full history so the version commit can be pushed.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Determine bump type
        id: bump-type
        run: |
          if ${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}; then
            echo "type=major" >> "$GITHUB_OUTPUT"
          elif ${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}; then
            echo "type=minor" >> "$GITHUB_OUTPUT"
          else
            echo "type=patch" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump version and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version ${{ steps.bump-type.outputs.type }} --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")
          git add package.json package-lock.json
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          git push
          git push --tags
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux

    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate macOS icon (ICNS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p build/icon.iconset
          sips -z 16   16   build/icon.png --out build/icon.iconset/icon_16x16.png
          sips -z 32   32   build/icon.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32   32   build/icon.png --out build/icon.iconset/icon_32x32.png
          sips -z 64   64   build/icon.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128  128  build/icon.png --out build/icon.iconset/icon_128x128.png
          sips -z 256  256  build/icon.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256  256  build/icon.png --out build/icon.iconset/icon_256x256.png
          sips -z 512  512  build/icon.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512  512  build/icon.png --out build/icon.iconset/icon_512x512.png
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Type-check electron main
        env:
          ELECTRON: "true"
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Build renderer (Electron mode)
        env:
          ELECTRON: "true"
        run: npx vite build

      - name: Package and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Suppress macOS code-signing when no certificate is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish always
