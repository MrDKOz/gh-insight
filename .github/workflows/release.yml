name: Release

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  prepare:
    # Only run when a PR with a release label is merged into main.
    if: |
      github.event.pull_request.merged == true &&
      github.event.pull_request.base.ref == 'main' &&
      (
        contains(github.event.pull_request.labels.*.name, 'release:patch') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:major')
      )

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.tag.outputs.version }}
      tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and create release
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(jq -r '.version' package.json)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push --tags
          gh release create "v$VERSION" \
            --title "GH Insight $VERSION" \
            --notes "Release $VERSION" \
            --draft
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
          - os: windows-latest
            label: Windows
          - os: ubuntu-latest
            label: Linux

    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.tag }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate macOS icon (ICNS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p build/icon.iconset
          sips -z 16   16   build/icon.png --out build/icon.iconset/icon_16x16.png
          sips -z 32   32   build/icon.png --out build/icon.iconset/icon_16x16@2x.png
          sips -z 32   32   build/icon.png --out build/icon.iconset/icon_32x32.png
          sips -z 64   64   build/icon.png --out build/icon.iconset/icon_32x32@2x.png
          sips -z 128  128  build/icon.png --out build/icon.iconset/icon_128x128.png
          sips -z 256  256  build/icon.png --out build/icon.iconset/icon_128x128@2x.png
          sips -z 256  256  build/icon.png --out build/icon.iconset/icon_256x256.png
          sips -z 512  512  build/icon.png --out build/icon.iconset/icon_256x256@2x.png
          sips -z 512  512  build/icon.png --out build/icon.iconset/icon_512x512.png
          iconutil -c icns build/icon.iconset -o build/icon.icns

      - name: Type-check electron main
        env:
          ELECTRON: "true"
        run: npx tsc -p tsconfig.electron.json --noEmit

      - name: Build renderer (Electron mode)
        env:
          ELECTRON: "true"
        run: npx vite build

      - name: Package
        env:
          # Suppress macOS code-signing when no certificate is configured.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --publish never

      - name: Upload release asset (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber "${{ needs.prepare.outputs.tag }}" dist-app/*.dmg

      - name: Upload release asset (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber "${{ needs.prepare.outputs.tag }}" dist-app/*.exe

      - name: Upload release asset (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload --clobber "${{ needs.prepare.outputs.tag }}" dist-app/*.AppImage
